name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Render the UI headlessly
        run: dotnet run --project tools/Screenshots -c Release -- shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Android workload
        run: dotnet workload install android
      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > umami.keystore
            echo "STORE_PASS=$KEYSTORE_PASS" >> $GITHUB_ENV
            echo "Using the release signing key"
          else
            # Pull requests from forks have no secrets: a throwaway key is fine there
            keytool -genkeypair -keystore umami.keystore -alias umami -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass umamimobile -keypass umamimobile -dname "CN=Umami Mobile, O=Umami"
            echo "STORE_PASS=umamimobile" >> $GITHUB_ENV
          fi
      - name: Build the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION=0.0.0
          dotnet publish src/UmamiMobile.Android -c Release -f net8.0-android \
            -p:ApplicationDisplayVersion=$VERSION -p:ApplicationVersion=${GITHUB_RUN_NUMBER} \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$PWD/umami.keystore -p:AndroidSigningKeyAlias=umami \
            -p:AndroidSigningKeyPass=env:STORE_PASS -p:AndroidSigningStorePass=env:STORE_PASS \
            -p:AcceptAndroidSDKLicenses=True
          APK=$(find src/UmamiMobile.Android -name '*-Signed.apk' | head -1)
          echo "Found $APK"
          mkdir -p dist
          cp "$APK" "dist/UmamiMobile-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: UmamiMobile-apk
          path: dist/*.apk
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Umami Mobile ${GITHUB_REF_NAME}" --generate-notes
